# ~/.config/tmux/tmux.conf

# --- General ---
# Set terminal to support 256 colors and RGB true color
set -a terminal-features "tmux-256color:RGB"

# Start window and pane numbering from 1 for easier access
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support for scrolling, pane selection, etc.
set -g mouse on

# Set a higher scrollback history limit (default is 2000)
set -g history-limit 10000

# Reduce the delay between pressing escape and tmux recognizing it
# This is crucial for responsiveness in editors like Vim/Neovim
set -sg escape-time 0

# Set the title of the terminal window to show session/window info
set -g set-titles on
set -g set-titles-string "#S / #W"


# --- Keybindings ---
# Reload config file with Prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes using | and - which are more intuitive
# They will also open in the same directory as the current pane
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"' # Unbind default horizontal split
unbind %  # Unbind default vertical split

# Move between panes with vim-style keys (h,j,k,l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim-style keys (H,J,K,L), make them repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# --- Copy Mode ---
# Enable vi-style keys for copy mode
setw -g mode-keys vi

# Start selection with 'v' and copy with 'y' in copy mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel


# --- Status Bar ---
# Set status bar style
# set -g status-position top # This line is commented out to move the status bar to the bottom (default)
set -g status-style 'bg=black fg=white'

# Left side: Session, Window, Pane
set -g status-left-length 40
set -g status-left "#[fg=green,bold]S: #S #[fg=white]W: #I #[fg=cyan]P: #P"

# Right side: Date and Time removed
set -g status-right ""

# Center the window list
set -g status-justify centre

# Highlight the current window in the status bar
setw -g window-status-current-style 'fg=black bg=green bold'
setw -g window-status-current-format ' #I:#W '

# Style for non-active windows
setw -g window-status-style 'fg=white bg=default'
setw -g window-status-format ' #I:#W '

# --- Plugins ---
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Restore tmux sessions automatically
set -g @continuum-restore 'on'
# Capture pane contents
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
